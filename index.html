<!DOCTYPE html>
<html lang="en">
<head>
<script data-goatcounter="https://momiji.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Dictation Practice</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a1a2e;
    --card: #16213e;
    --card2: #0f3460;
    --accent: #e94560;
    --accent2: #f5a623;
    --text: #eaeaea;
    --text-soft: #8892a4;
    --green: #4ecca3;
    --blue: #4ea8de;
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
    --radius: 20px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 40px;
  }
  h1 { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--text); margin-bottom: 4px; text-align: center; }
  .subtitle { color: var(--text-soft); font-size: 0.85rem; margin-bottom: 24px; text-align: center; }
  .editor-section { width: 100%; max-width: 600px; background: var(--card); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow); }
  .editor-section h2 { font-size: 0.85rem; font-weight: 500; color: var(--accent2); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 10px; }
  textarea { width: 100%; background: #0a0a1a; border: 1px solid #2a2a4a; border-radius: 10px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.88rem; padding: 12px; resize: vertical; min-height: 180px; line-height: 1.7; outline: none; }
  textarea:focus { border-color: var(--accent); }
  .editor-note { font-size: 0.75rem; color: var(--text-soft); margin-top: 6px; line-height: 1.6; }
  .settings-row { display: flex; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
  .setting-item { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 120px; }
  .setting-item label { font-size: 0.75rem; color: var(--text-soft); letter-spacing: 0.05em; }
  select { background: #0a0a1a; border: 1px solid #2a2a4a; border-radius: 8px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.85rem; padding: 6px 10px; outline: none; width: 100%; }
  .btn-start { width: 100%; max-width: 600px; padding: 16px; background: var(--accent); color: white; border: none; border-radius: var(--radius); font-family: 'DM Sans', sans-serif; font-size: 1rem; font-weight: 500; cursor: pointer; margin-bottom: 24px; transition: all 0.2s; letter-spacing: 0.05em; }
  .btn-start:hover { background: #c73550; transform: translateY(-1px); }
  .practice-area { width: 100%; max-width: 600px; display: none; }
  .practice-area.show { display: block; }
  .progress-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 0.82rem; color: var(--text-soft); }
  .progress-bar-wrap { background: #0a0a1a; border-radius: 10px; height: 6px; margin-bottom: 20px; overflow: hidden; }
  .progress-bar { height: 6px; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 10px; transition: width 0.5s ease; }
  .word-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px 24px; text-align: center; margin-bottom: 16px; min-height: 240px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
  .repeat-badge { position: absolute; top: 16px; right: 16px; background: var(--card2); color: var(--accent2); font-size: 0.75rem; font-weight: 500; padding: 4px 10px; border-radius: 20px; }
  .word-display { font-family: 'Playfair Display', serif; font-size: 2.2rem; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .phonetic-display { font-size: 0.95rem; color: var(--text-soft); margin-bottom: 8px; font-style: italic; letter-spacing: 0.02em; }
  .chinese-display { font-size: 1.25rem; color: var(--green); font-weight: 400; margin-bottom: 6px; }
  .example-display { font-size: 0.95rem; color: var(--blue); font-style: italic; margin-top: 4px; padding: 0 10px; line-height: 1.5; }
  .status-display { font-size: 0.85rem; color: var(--text-soft); margin-top: 14px; }
  .timer-wrap { margin: 14px 0 6px; position: relative; width: 80px; height: 80px; }
  .timer-svg { transform: rotate(-90deg); }
  .timer-track { fill: none; stroke: #2a2a4a; stroke-width: 6; }
  .timer-fill { fill: none; stroke: var(--accent2); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 0.1s linear; }
  .timer-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.3rem; font-weight: 500; color: var(--accent2); }
  .controls { display: flex; gap: 10px; margin-bottom: 20px; }
  .btn-ctrl { flex: 1; padding: 12px; border: none; border-radius: 12px; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: all 0.2s; }
  .btn-pause { background: var(--card2); color: var(--text); }
  .btn-skip { background: #2a2a4a; color: var(--text-soft); }
  .btn-restart { background: var(--accent); color: white; }
  .btn-ctrl:hover { opacity: 0.85; }
  .word-list-preview { background: var(--card); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 16px; }
  .word-list-preview h3 { font-size: 0.78rem; color: var(--text-soft); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 10px; }
  .word-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .word-chip { background: #0a0a1a; color: var(--text-soft); font-size: 0.78rem; padding: 4px 10px; border-radius: 20px; transition: all 0.3s; }
  .word-chip.done { background: var(--green); color: #0a0a1a; font-weight: 500; }
  .word-chip.current { background: var(--accent); color: white; font-weight: 500; }
  .finished-card { padding: 20px; text-align: center; }
  .finished-card .emoji { font-size: 3rem; margin-bottom: 12px; }
  .finished-card h2 { font-family: 'Playfair Display', serif; font-size: 1.6rem; margin-bottom: 8px; }
  .finished-card p { color: var(--text-soft); margin-bottom: 20px; }
  footer-note { display: block; text-align: center; color: var(--text-soft); font-size: 0.78rem; padding: 10px 0; }
</style>
</head>
<body>

<h1>📝 Momi's Dictation Practice</h1>
<p class="subtitle">Auto-read · Write on paper · Check yourself</p>

<div class="editor-section">
  <h2>📚 Word List</h2>
  <textarea id="wordInput" placeholder="支持3种格式，可以混用：

格式1：单词 中文
pub 小酒店

格式2：单词 /音标/ 中文
bullfight /ˈbʊlfaɪt/ 斗牛

格式3：单词 /音标/ 中文 例句
drunk /drʌŋk/ 醉汉 A drunk wandered into the ring
wander /ˈwɒndə(r)/ 溜达；乱走 He wandered into the street
ring /rɪŋ/ 圆形竞技场地 A drunk wandered into the ring
crowd /kraʊd/ 人群 The crowd began to shout"></textarea>
  <p class="editor-note">
    📌 音标只显示，不朗读<br>
    📌 有例句时，读完中文自动朗读例句<br>
    📌 格式：单词 /音标(可选)/ 中文 例句(可选)
  </p>

  <div class="settings-row">
    <div class="setting-item">
      <label>Repeats per word</label>
      <select id="repeatCount">
        <option value="2">2 times</option>
        <option value="3">3 times</option>
        <option value="4" selected>4 times</option>
        <option value="5">5 times</option>
      </select>
    </div>
    <div class="setting-item">
      <label>Pause between reads</label>
      <select id="pauseBetween">
        <option value="1">1s</option>
        <option value="3" selected>3s</option>
        <option value="6">6s</option>
        <option value="9">9s</option>
        <option value="12">12s</option>
      </select>
    </div>
    <div class="setting-item">
      <label>Writing time</label>
      <select id="writeTime">
        <option value="1">1s</option>
        <option value="4" selected>4s</option>
        <option value="8">8s</option>
        <option value="12">12s</option>
        <option value="16">16s</option>
      </select>
    </div>
  </div>
  <div class="settings-row" style="margin-top:10px">
    <div class="setting-item" style="flex:2;min-width:200px">
      <label>🔊 English Voice</label>
      <select id="voiceSelect">
        <option value="auto">Auto (default)</option>
      </select>
    </div>
  </div>
</div>

<button class="btn-start" onclick="startDictation()">▶ Start Dictation</button>

<div class="practice-area" id="practiceArea">
  <div class="progress-info">
    <span id="progressText">Word 1 of 10</span>
    <span id="progressPct">0%</span>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-bar" id="progressBar" style="width:0%"></div>
  </div>

  <div class="word-card" id="wordCard">
    <div class="repeat-badge" id="repeatBadge">1 / 4</div>
    <div class="word-display" id="wordDisplay">—</div>
    <div class="phonetic-display" id="phoneticDisplay"></div>
    <div class="chinese-display" id="chineseDisplay"></div>
    <div class="example-display" id="exampleDisplay"></div>
    <div class="timer-wrap" id="timerWrap" style="display:none">
      <svg class="timer-svg" width="80" height="80" viewBox="0 0 80 80">
        <circle class="timer-track" cx="40" cy="40" r="34"/>
        <circle class="timer-fill" id="timerCircle" cx="40" cy="40" r="34"
          stroke-dasharray="213.6" stroke-dashoffset="0"/>
      </svg>
      <div class="timer-text" id="timerText">8</div>
    </div>
    <div class="status-display" id="statusDisplay">Getting ready...</div>
  </div>

  <div class="controls">
    <button class="btn-ctrl btn-pause" id="pauseBtn" onclick="togglePause()">⏸ Pause</button>
    <button class="btn-ctrl btn-skip" onclick="skipWord()">⏭ Skip</button>
    <button class="btn-ctrl btn-restart" onclick="restartDictation()">↩ Restart</button>
  </div>

  <div class="word-list-preview">
    <h3>Progress</h3>
    <div class="word-chips" id="wordChips"></div>
  </div>
</div>

<script>
let words = [];
let currentIndex = 0;
let currentRepeat = 0;
let totalRepeats = 4;
let pauseBetween = 1500;
let writeTime = 8;
let isPaused = false;
let timeoutId = null;
let timerInterval = null;
let timerRemaining = 0;

// Parse a line into { english, phonetic, chinese, example }
function parseLine(line) {
  line = line.trim();
  if (!line) return null;

  let phonetic = '';
  // Extract phonetic between / /
  const phoneticMatch = line.match(/\/[^/]+\//);
  if (phoneticMatch) {
    phonetic = phoneticMatch[0];
    line = line.replace(phonetic, '').replace(/\s+/g, ' ').trim();
  }

  const parts = line.split(/\s+/);
  const english = parts[0];
  const rest = parts.slice(1).join(' ');

  // Split chinese and example sentence
  // Chinese is up to the first English word (capital or known pattern)
  // Simple heuristic: chinese chars + punctuation are Chinese, then rest is example
  let chinese = '';
  let example = '';

  // Find where Chinese ends and English example begins
  // Chinese meaning ends at first ASCII letter sequence that looks like a sentence
  const chineseMatch = rest.match(/^([^\x00-\x7F;；，,\s][^a-zA-Z]*(?:[；;，,][^a-zA-Z]*)*)\s*(.*)$/);
  if (chineseMatch) {
    chinese = chineseMatch[1].trim();
    example = chineseMatch[2].trim();
  } else {
    // fallback: try to split by first capital letter that starts a word
    const splitIdx = rest.search(/\s[A-Z]/);
    if (splitIdx > 0) {
      chinese = rest.substring(0, splitIdx).trim();
      example = rest.substring(splitIdx).trim();
    } else {
      chinese = rest;
    }
  }

  return { english, phonetic, chinese, example };
}

function parseWords(text) {
  return text.trim().split('\n')
    .map(parseLine)
    .filter(w => w && w.english && w.english.length > 0);
}

function startDictation() {
  words = parseWords(document.getElementById('wordInput').value);
  if (words.length === 0) { alert('Please enter some words!'); return; }

  totalRepeats = parseInt(document.getElementById('repeatCount').value);
  pauseBetween = parseFloat(document.getElementById('pauseBetween').value) * 1000;
  writeTime = parseInt(document.getElementById('writeTime').value);

  currentIndex = 0;
  currentRepeat = 0;
  isPaused = false;

  document.getElementById('practiceArea').classList.add('show');
  document.getElementById('practiceArea').scrollIntoView({ behavior: 'smooth' });

  buildChips();
  processNext();
}

function buildChips() {
  const container = document.getElementById('wordChips');
  container.innerHTML = '';
  words.forEach((w, i) => {
    const chip = document.createElement('span');
    chip.className = 'word-chip';
    chip.id = `chip-${i}`;
    chip.textContent = w.english;
    container.appendChild(chip);
  });
}

function updateChips() {
  words.forEach((w, i) => {
    const chip = document.getElementById(`chip-${i}`);
    if (!chip) return;
    chip.className = 'word-chip';
    if (i < currentIndex) chip.classList.add('done');
    else if (i === currentIndex) chip.classList.add('current');
  });
}

function updateProgress() {
  const pct = Math.round((currentIndex / words.length) * 100);
  document.getElementById('progressText').textContent = `Word ${currentIndex + 1} of ${words.length}`;
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressBar').style.width = pct + '%';
}

function processNext() {
  if (isPaused) return;
  if (currentIndex >= words.length) { showFinished(); return; }

  const word = words[currentIndex];
  currentRepeat = 0;
  updateProgress();
  updateChips();
  readWordCycle(word);
}

function readWordCycle(word) {
  if (isPaused) return;
  if (currentRepeat >= totalRepeats) {
    startWritingTimer(word);
    return;
  }

  currentRepeat++;
  document.getElementById('repeatBadge').textContent = `${currentRepeat} / ${totalRepeats}`;
  document.getElementById('wordDisplay').textContent = word.english;
  document.getElementById('phoneticDisplay').textContent = word.phonetic || '';
  document.getElementById('chineseDisplay').textContent = '';
  document.getElementById('exampleDisplay').textContent = '';
  document.getElementById('timerWrap').style.display = 'none';
  document.getElementById('statusDisplay').textContent = '🔊 Listening...';

  // 1. Speak English word
  speakText(word.english, 'en-US', () => {
    if (isPaused) return;
    timeoutId = setTimeout(() => {
      if (isPaused) return;
      // 2. Show & speak Chinese
      document.getElementById('chineseDisplay').textContent = word.chinese;
      // Clean chinese for speech (remove semicolons etc)
      const chineseForSpeech = word.chinese.replace(/[；;]/g, '，');
      speakText(chineseForSpeech, 'zh-CN', () => {
        if (isPaused) return;
        // 3. If example exists, speak it
        if (word.example) {
          timeoutId = setTimeout(() => {
            if (isPaused) return;
            document.getElementById('exampleDisplay').textContent = word.example;
            document.getElementById('statusDisplay').textContent = '📖 Example sentence...';
            speakText(word.example, 'en-US', () => {
              if (isPaused) return;
              timeoutId = setTimeout(() => readWordCycle(word), pauseBetween);
            });
          }, 400);
        } else {
          timeoutId = setTimeout(() => readWordCycle(word), pauseBetween);
        }
      });
    }, 400);
  });
}

function startWritingTimer(word) {
  if (isPaused) return;
  document.getElementById('wordDisplay').textContent = word.english;
  document.getElementById('phoneticDisplay').textContent = word.phonetic || '';
  document.getElementById('chineseDisplay').textContent = word.chinese;
  document.getElementById('exampleDisplay').textContent = word.example || '';
  document.getElementById('timerWrap').style.display = 'block';
  document.getElementById('statusDisplay').textContent = '✍️ Write it down!';
  document.getElementById('repeatBadge').textContent = '✍️ Write';

  const circumference = 213.6;
  timerRemaining = writeTime;
  document.getElementById('timerText').textContent = timerRemaining;
  document.getElementById('timerCircle').style.strokeDashoffset = 0;

  timerInterval = setInterval(() => {
    if (isPaused) return;
    timerRemaining--;
    document.getElementById('timerText').textContent = timerRemaining;
    const offset = circumference * (1 - timerRemaining / writeTime);
    document.getElementById('timerCircle').style.strokeDashoffset = offset;
    if (timerRemaining <= 0) {
      clearInterval(timerInterval);
      currentIndex++;
      timeoutId = setTimeout(() => processNext(), 600);
    }
  }, 1000);
}

function speakText(text, lang, callback) {
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = lang;
  utt.rate = 0.85;
  const voices = window.speechSynthesis.getVoices();
  if (lang === 'en-US') {
    const selected = getSelectedVoice();
    if (selected) { utt.voice = selected; utt.lang = selected.lang; }
    else {
      const v = voices.find(v => v.lang === 'en-US') || voices.find(v => v.lang.startsWith('en'));
      if (v) utt.voice = v;
    }
  } else {
    const v = voices.find(v => v.lang === 'zh-CN') || voices.find(v => v.lang.startsWith('zh'));
    if (v) utt.voice = v;
  }
  utt.onend = callback;
  utt.onerror = callback;
  window.speechSynthesis.speak(utt);
}

function togglePause() {
  isPaused = !isPaused;
  const btn = document.getElementById('pauseBtn');
  if (isPaused) {
    btn.textContent = '▶ Resume';
    btn.style.background = '#4ecca3';
    btn.style.color = '#0a0a1a';
    window.speechSynthesis.cancel();
    clearInterval(timerInterval);
    clearTimeout(timeoutId);
    document.getElementById('statusDisplay').textContent = '⏸ Paused';
  } else {
    btn.textContent = '⏸ Pause';
    btn.style.background = '';
    btn.style.color = '';
    currentRepeat = 0;
    clearInterval(timerInterval);
    if (currentIndex < words.length) readWordCycle(words[currentIndex]);
  }
}

function skipWord() {
  window.speechSynthesis.cancel();
  clearInterval(timerInterval);
  clearTimeout(timeoutId);
  currentIndex++;
  setTimeout(() => processNext(), 300);
}

function restartDictation() {
  window.speechSynthesis.cancel();
  clearInterval(timerInterval);
  clearTimeout(timeoutId);
  currentIndex = 0;
  currentRepeat = 0;
  isPaused = false;
  document.getElementById('pauseBtn').textContent = '⏸ Pause';
  document.getElementById('pauseBtn').style.background = '';
  buildChips();
  processNext();
}

function showFinished() {
  document.getElementById('wordCard').innerHTML = `
    <div class="finished-card">
      <div class="emoji">🎉</div>
      <h2>All Done!</h2>
      <p>You've completed all ${words.length} words!<br>Check your paper and see how many you got right.</p>
      <button class="btn-start" onclick="restartDictation()" style="max-width:200px">↩ Again</button>
    </div>
  `;
  words.forEach((w, i) => {
    const chip = document.getElementById(`chip-${i}`);
    if (chip) chip.className = 'word-chip done';
  });
  document.getElementById('progressBar').style.width = '100%';
  document.getElementById('progressPct').textContent = '100%';
}

function loadVoices() {
  const voices = window.speechSynthesis.getVoices();
  const engVoices = voices.filter(v => v.lang.startsWith('en'));
  const select = document.getElementById('voiceSelect');
  select.innerHTML = '<option value="auto">Auto (default)</option>';
  engVoices.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v.name;
    opt.textContent = v.name + ' (' + v.lang + ')';
    if (v.name === 'Google UK English Female') opt.selected = true;
    select.appendChild(opt);
  });
}

function getSelectedVoice() {
  const selected = document.getElementById('voiceSelect').value;
  if (selected === 'auto') return null;
  return window.speechSynthesis.getVoices().find(v => v.name === selected) || null;
}

window.speechSynthesis.onvoiceschanged = () => loadVoices();
loadVoices();
</script>
</body>
</html>
